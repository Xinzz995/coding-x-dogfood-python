name: Quality Gate

# Generated from .coding-x/quality.json. Change the contract, then regenerate.
on:
  pull_request:
  push:
    branches: ['main']

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks_linux-primary:
    name: checks / linux-primary
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 'toolchain / python 3.12'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: 'setup / 1'
        working-directory: '.'
        timeout-minutes: 10
        shell: bash
        run: '''python'' ''-m'' ''venv'' ''.venv'''
      - name: 'setup / 2'
        working-directory: '.'
        timeout-minutes: 10
        shell: bash
        run: '''.venv/bin/python'' ''-m'' ''pip'' ''install'' ''pip==25.3'' ''packages/api[dev]'' ''packages/worker[dev]'''
      - name: 'test / test-packages-api-posix'
        working-directory: '.'
        timeout-minutes: 10
        shell: bash
        run: '''.venv/bin/python'' ''-B'' ''-m'' ''pytest'' ''-p'' ''no:cacheprovider'' ''packages/api/tests'''
      - name: 'test / test-packages-worker-posix'
        working-directory: '.'
        timeout-minutes: 10
        shell: bash
        run: '''.venv/bin/python'' ''-B'' ''-m'' ''pytest'' ''-p'' ''no:cacheprovider'' ''packages/worker/tests'''
      - name: 'build / build-packages-api-posix'
        working-directory: '.'
        timeout-minutes: 10
        shell: bash
        run: '''.venv/bin/python'' ''-m'' ''pip'' ''wheel'' ''packages/api'' ''--no-deps'' ''--wheel-dir'' ''packages/api/dist'''
      - name: 'build / build-packages-worker-posix'
        working-directory: '.'
        timeout-minutes: 10
        shell: bash
        run: '''.venv/bin/python'' ''-m'' ''pip'' ''wheel'' ''packages/worker'' ''--no-deps'' ''--wheel-dir'' ''packages/worker/dist'''
      - name: 'static / ruff-packages-api-posix'
        working-directory: '.'
        timeout-minutes: 10
        shell: bash
        run: '''.venv/bin/python'' ''-m'' ''ruff'' ''check'' ''--no-cache'' ''packages/api'''
      - name: 'static / ruff-packages-worker-posix'
        working-directory: '.'
        timeout-minutes: 10
        shell: bash
        run: '''.venv/bin/python'' ''-m'' ''ruff'' ''check'' ''--no-cache'' ''packages/worker'''
  checks_macos-primary:
    name: checks / macos-primary
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 'toolchain / python 3.12'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: 'setup / 1'
        working-directory: '.'
        timeout-minutes: 10
        shell: bash
        run: '''python'' ''-m'' ''venv'' ''.venv'''
      - name: 'setup / 2'
        working-directory: '.'
        timeout-minutes: 10
        shell: bash
        run: '''.venv/bin/python'' ''-m'' ''pip'' ''install'' ''pip==25.3'' ''packages/api[dev]'' ''packages/worker[dev]'''
      - name: 'test / test-packages-api-posix'
        working-directory: '.'
        timeout-minutes: 10
        shell: bash
        run: '''.venv/bin/python'' ''-B'' ''-m'' ''pytest'' ''-p'' ''no:cacheprovider'' ''packages/api/tests'''
      - name: 'test / test-packages-worker-posix'
        working-directory: '.'
        timeout-minutes: 10
        shell: bash
        run: '''.venv/bin/python'' ''-B'' ''-m'' ''pytest'' ''-p'' ''no:cacheprovider'' ''packages/worker/tests'''
      - name: 'build / build-packages-api-posix'
        working-directory: '.'
        timeout-minutes: 10
        shell: bash
        run: '''.venv/bin/python'' ''-m'' ''pip'' ''wheel'' ''packages/api'' ''--no-deps'' ''--wheel-dir'' ''packages/api/dist'''
      - name: 'build / build-packages-worker-posix'
        working-directory: '.'
        timeout-minutes: 10
        shell: bash
        run: '''.venv/bin/python'' ''-m'' ''pip'' ''wheel'' ''packages/worker'' ''--no-deps'' ''--wheel-dir'' ''packages/worker/dist'''
      - name: 'static / ruff-packages-api-posix'
        working-directory: '.'
        timeout-minutes: 10
        shell: bash
        run: '''.venv/bin/python'' ''-m'' ''ruff'' ''check'' ''--no-cache'' ''packages/api'''
      - name: 'static / ruff-packages-worker-posix'
        working-directory: '.'
        timeout-minutes: 10
        shell: bash
        run: '''.venv/bin/python'' ''-m'' ''ruff'' ''check'' ''--no-cache'' ''packages/worker'''
  checks_windows-primary:
    name: checks / windows-primary
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 'toolchain / python 3.12'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: 'setup / 1'
        working-directory: '.'
        timeout-minutes: 10
        shell: pwsh
        run: '& ''python'' ''-m'' ''venv'' ''.venv'''
      - name: 'setup / 2'
        working-directory: '.'
        timeout-minutes: 10
        shell: pwsh
        run: '& ''.venv/Scripts/python.exe'' ''-m'' ''pip'' ''install'' ''pip==25.3'' ''packages/api[dev]'' ''packages/worker[dev]'''
      - name: 'test / test-packages-api-windows'
        working-directory: '.'
        timeout-minutes: 10
        shell: pwsh
        run: '& ''.venv/Scripts/python.exe'' ''-B'' ''-m'' ''pytest'' ''-p'' ''no:cacheprovider'' ''packages/api/tests'''
      - name: 'test / test-packages-worker-windows'
        working-directory: '.'
        timeout-minutes: 10
        shell: pwsh
        run: '& ''.venv/Scripts/python.exe'' ''-B'' ''-m'' ''pytest'' ''-p'' ''no:cacheprovider'' ''packages/worker/tests'''
      - name: 'build / build-packages-api-windows'
        working-directory: '.'
        timeout-minutes: 10
        shell: pwsh
        run: '& ''.venv/Scripts/python.exe'' ''-m'' ''pip'' ''wheel'' ''packages/api'' ''--no-deps'' ''--wheel-dir'' ''packages/api/dist'''
      - name: 'build / build-packages-worker-windows'
        working-directory: '.'
        timeout-minutes: 10
        shell: pwsh
        run: '& ''.venv/Scripts/python.exe'' ''-m'' ''pip'' ''wheel'' ''packages/worker'' ''--no-deps'' ''--wheel-dir'' ''packages/worker/dist'''
      - name: 'static / ruff-packages-api-windows'
        working-directory: '.'
        timeout-minutes: 10
        shell: pwsh
        run: '& ''.venv/Scripts/python.exe'' ''-m'' ''ruff'' ''check'' ''--no-cache'' ''packages/api'''
      - name: 'static / ruff-packages-worker-windows'
        working-directory: '.'
        timeout-minutes: 10
        shell: pwsh
        run: '& ''.venv/Scripts/python.exe'' ''-m'' ''ruff'' ''check'' ''--no-cache'' ''packages/worker'''
  quality-gate:
    name: quality-gate
    if: ${{ always() }}
    needs: [checks_linux-primary, checks_macos-primary, checks_windows-primary]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Verify every required job completed successfully
        shell: bash
        env:
          RESULT_1: ${{ needs.checks_linux-primary.result }}
          RESULT_2: ${{ needs.checks_macos-primary.result }}
          RESULT_3: ${{ needs.checks_windows-primary.result }}
        run: |
          failed=0
          for result in "${!RESULT_@}"; do
            value="${!result}"
            if [ "$value" != "success" ]; then
              echo "::error::${result}=${value}; required jobs must not fail, cancel, time out, or skip"
              failed=1
            fi
          done
          exit "$failed"
