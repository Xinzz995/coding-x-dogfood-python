[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-x-dogfood-worker"
version = "0.1.0"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "ruff==0.12.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
